<!doctype html><html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Двадцать четыре экрана — кликабельно</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0e1016;--panel:#161a23;--ink:#e8ecf4;--dim:#7d879c;--line:#242a37;--lime:#c8f31e;--indigo:#5b6cff;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Inter","Segoe UI",Arial,sans-serif;display:grid;grid-template-columns:296px 1fr}
a{color:inherit;text-decoration:none}

aside{border-right:1px solid var(--line);display:grid;grid-template-rows:auto 1fr auto;min-height:0;background:var(--panel)}
.head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.head h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.4px}
.head p{margin:6px 0 0;font-size:11.5px;color:var(--dim);line-height:1.5}
.list{overflow-y:auto;padding:8px 10px 12px}
.grp{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#5c6478;padding:14px 10px 6px}
.it{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;
  align-items:start;border:1px solid transparent}
.it:hover{background:#1c2130}
.it.on{background:var(--indigo);border-color:#7b88ff}
.it .n{font-size:11px;font-weight:700;color:var(--dim);padding-top:2px;font-variant-numeric:tabular-nums}
.it.on .n{color:#dfe3ff}
.it b{display:block;font-size:12.5px;font-weight:600;letter-spacing:-.2px;line-height:1.25}
.it i{font-style:normal;display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
.it.on i{color:#c9cfff}
.it .dot{width:6px;height:6px;border-radius:50%;background:var(--lime);display:inline-block;margin-left:6px;vertical-align:1px}
.foot{padding:12px 20px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);line-height:1.5}
.foot b{color:var(--lime)}

main{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0}
.bar{padding:14px 22px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}
.bar h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.3px}
.bar .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:4px 11px}
.nav{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);border-radius:7px;padding:7px 14px;font-size:12.5px;cursor:pointer;background:#1a1f2b}
.btn:hover{border-color:#3b455c}
.btn.open{background:var(--lime);color:#12160a;border-color:var(--lime);font-weight:600}
.count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

.stagewrap{position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;
  padding:18px;background:repeating-conic-gradient(#12151d 0% 25%,#0f1219 0% 50%) 0 0/22px 22px}
#frame{width:1120px;height:780px;border:0;border-radius:8px;box-shadow:0 24px 70px #0009;transform-origin:center;
  background:#fff}

.hint{padding:12px 22px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:14px;
  align-items:start}
.hint .k{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);
  border:1px solid #3d4a12;background:#1b2110;border-radius:6px;padding:6px 10px;white-space:nowrap}
.hint p{margin:0;font-size:13px;line-height:1.55;color:#c3cad9}
.hint p em{font-style:normal;color:var(--lime)}
.hint.none .k{color:#8a93a8;border-color:var(--line);background:#171b25}
.hint.none p{color:var(--dim)}
</style></head><body>

<aside>
  <div class="head">
    <h1>Двадцать четыре экрана</h1>
    <p>Живые страницы, не картинки. Кликайте прямо в экран — фильтры, вкладки, сортировка и калькуляторы работают. Перезагрузка возвращает исходное состояние.</p>
  </div>
  <div class="list" id="list"></div>
  <div class="foot"><b>●</b> — на экране есть что нажать. Стрелки ← → листают.</div>
</aside>

<main>
  <div class="bar">
    <h2 id="title">—</h2>
    <span class="tag" id="tag">—</span>
    <span class="nav">
      <span class="count" id="count"></span>
      <span class="btn" id="prev">←</span>
      <span class="btn" id="next">→</span>
      <a class="btn open" id="open" target="_blank">Открыть отдельно</a>
    </span>
  </div>
  <div class="stagewrap" id="wrap"><iframe id="frame" title="Экран"></iframe></div>
  <div class="hint" id="hint"><span class="k">Что попробовать</span><p id="hinttext">—</p></div>
</main>

<script>
const S = [
 ['31','clinic-priem','Расписание приёма','Клиника · рабочая система','Переключите <em>День / Неделя / Врач</em> в правом верхнем углу.',1],
 ['32','chalk-stoplist','Стоп-лист и фудкост','Ресторан · рабочая система','Щёлкните по заголовку столбца — <em>Фудкост</em> или <em>Продано</em>. Таблица сортируется, второй щелчок разворачивает порядок.',1],
 ['33','nouveau-zapis','Онлайн-запись','Салон красоты · рабочая система','Щёлкните по счётчикам сверху — <em>записей / загрузка / средний чек</em>.',1],
 ['34','scoreboard-abonement','Абонементы и посещаемость','Фитнес · рабочая система','Здесь кликать нечего — это сводка, которую смотрят, а не трогают.',0],
 ['35','carbon-naryad','Заказ-наряд','Автосервис · рабочая система','Заголовки таблицы сортируют строки наряда.',1],
 ['36','cartography-marshrut','Маршруты курьеров','Доставка · рабочая система','Щёлкните по точке в списке справа — она выделяется.',1],
 ['37','architect-obiekty','Объекты и сделки','Недвижимость · рабочая система','Сортируйте сделки по <em>Сумме</em> или <em>Комиссии</em> щелчком по заголовку.',1],
 ['38','industrial-smena','Сменное задание и OEE','Производство · рабочая система','Заголовки таблицы задания сортируют строки — попробуйте <em>Готовность</em>.',1],
 ['39','riso-gruppy','Группы и оплата','Учебный центр · рабочая система','Щёлкните по плитке в верхней полосе — выбор переключается.',1],
 ['40','concierge-shahmatka','Шахматка бронирования','Отель · рабочая система','Щёлкните по карточке в полосе <em>Заезды / Выезды / Ранний заезд</em>.',1],
 ['41','minimal-mebel','Каталог мебели','Интернет-магазин · сайт','Чипы <em>Диваны / Кресла / Кровати / Столы / Хранение</em> действительно фильтруют витрину. «Все» возвращает восемь карточек.',1],
 ['42','brutal-katalog','Оптовый каталог','B2B-прайс · сайт','Фильтры <em>Дренажные / Фекальные / Комплекты / Только в наличии</em> убирают лишние строки. Заголовки сортируют по цене и остатку.',1],
 ['43','skeuo-yuvelir','Витрина ювелирного','Магазин украшений · сайт','<em>Белое золото / Жёлтое / Розовое / До 200 000 ₽</em> фильтруют витрину.',1],
 ['44','pop-kliining','Лендинг с калькулятором','Клининг · сайт','Настоящий калькулятор: смените <em>тип уборки</em>, число <em>санузлов</em>, включите допы, потяните по полосе площади — цена и подпись пересчитываются.',1],
 ['45','cinema-zastroyshchik','Выбор квартиры','Застройщик · сайт','Щёлкните по любой свободной квартире в шахматке — выбор переезжает, номер справа меняется.',1],
 ['46','dense-obyavleniya','Поиск по объявлениям','Доска объявлений · сайт','Галочки <em>Частное лицо / Магазин</em> и <em>С доставкой</em> фильтруют список. Условия внутри группы складываются по «или», между группами — по «и».',1],
 ['47','gastro-restoran','Меню и бронь стола','Ресторан · сайт','Вкладки меню фильтруют блюда. Дата, время, число гостей и зона собирают надпись на кнопке брони.',1],
 ['48','rounded-kursy','Каталог курсов','Образование · сайт','Чипы направлений фильтруют карточки — <em>Языки</em>, <em>ИТ</em>, <em>Выходного дня</em>.',1],
 ['49','magazine-tury','Подборка туров','Туризм · сайт','Щёлкните по карточке направления — она выделяется.',1],
 ['50','configurator-avto','Конфигуратор автомобиля','Автосалон · сайт','Полноценный расчёт: смените <em>комплектацию</em>, <em>двигатель</em>, включите или снимите пакеты опций — смета справа перестраивается, итог и платёж считаются заново.',1],
 ['51','tool-sverka','Сверка выгрузок','Инструмент','Щёлкните по плашкам <em>цена выросла / нет у поставщика / новые позиции</em> — таблица фильтруется. Заголовки сортируют.',1],
 ['52','integration-obmen','Обмен 1С ↔ маркетплейс','Интеграция','Щёлкните по полосе обмена — она выделяется.',1],
 ['53','system-torgovaya','Торговая компания','Система','Период <em>Неделя / Месяц / Квартал / Год</em>, модули в левом меню, сортировка таблицы «Требует решения».',1],
 ['54','ecosystem-landshaft','Группа компаний','Экосистема','Щёлкните по роли вверху — <em>Кладовщик</em>, <em>Курьер</em>, <em>Бухгалтер</em> — и увидите, какими продуктами она пользуется. Щелчок по чёрному ядру снимает подсветку.',1],
];
const GROUPS = [['Рабочие системы',0,10],['Сайты, которые продают',10,20],['Инструмент → экосистема',20,24]];

const list=document.getElementById('list'), frame=document.getElementById('frame');
let cur=0;

GROUPS.forEach(([name,a,b])=>{
  const h=document.createElement('div'); h.className='grp'; h.textContent=name; list.append(h);
  S.slice(a,b).forEach((s,k)=>{
    const i=a+k;
    const el=document.createElement('div');
    el.className='it'; el.dataset.i=i;
    el.innerHTML=`<span class="n">${s[0]}</span><span><b>${s[2]}${s[5]?'<i class="dot"></i>':''}</b><i>${s[3]}</i></span>`;
    el.onclick=()=>show(i);
    list.append(el);
  });
});

function show(i){
  cur=(i+S.length)%S.length;
  const s=S[cur];
  const url=`screens/${s[0]}-${s[1]}.html`;
  frame.src=url;
  document.getElementById('title').textContent=s[2];
  document.getElementById('tag').textContent=s[3];
  document.getElementById('open').href=url;
  document.getElementById('count').textContent=(cur+1)+' / '+S.length;
  const hint=document.getElementById('hint');
  hint.className='hint'+(s[5]?'':' none');
  hint.querySelector('.k').textContent=s[5]?'Что попробовать':'Без интерактива';
  document.getElementById('hinttext').innerHTML=s[4];
  [...list.querySelectorAll('.it')].forEach(e=>e.classList.toggle('on',+e.dataset.i===cur));
  const act=list.querySelector('.it.on'); if(act) act.scrollIntoView({block:'nearest'});
}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') show(cur-1);
  if(e.key==='ArrowRight') show(cur+1);
});

// Артборд 1120×780 вписывается в свободное место; клики при этом работают —
// transform не мешает попаданию курсора.
const wrap=document.getElementById('wrap');
const fit=()=>{
  const s=Math.min((wrap.clientWidth-36)/1120,(wrap.clientHeight-36)/780,1);
  frame.style.transform=`scale(${s.toFixed(4)})`;
};
addEventListener('resize',fit);
new ResizeObserver(fit).observe(wrap);
show(0); fit();
</script>
</body></html>
